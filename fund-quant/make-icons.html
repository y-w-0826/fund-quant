<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>生成 APP 图标</title>
<style>body{background:#0d1424;color:#e5ecf8;font-family:sans-serif;padding:40px;text-align:center}
button{margin:10px;padding:12px 24px;font-size:15px;border-radius:10px;border:1px solid #22314f;background:#0a1120;color:#38bdf8;cursor:pointer}
img{display:block;margin:20px auto;border-radius:24px}</style></head>
<body>
<h2>基金量化工作台 · 图标生成器</h2>
<img id="preview" width="128" height="128" alt="预览"/>
<div>
  <button onclick="dl(512,'icon-512.png')">下载 icon-512.png</button>
  <button onclick="dl(192,'icon-192.png')">下载 icon-192.png</button>
  <button onclick="dl(180,'apple-touch-icon.png')">下载 apple-touch-icon.png</button>
</div>
<p style="color:#8294b5">依次下载 3 个文件，与 index.html 放在同一目录即可。</p>
<script>
var SVG = document.querySelector('link') ? '' : '';
var svgText = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#13253f"/><stop offset="1" stop-color="#070b14"/></linearGradient><linearGradient id="ln" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#38bdf8"/></linearGradient></defs><rect width="512" height="512" rx="112" fill="url(#bg)"/><rect x="92" y="286" width="42" height="104" rx="8" fill="#00c087" opacity=".8"/><rect x="176" y="248" width="42" height="142" rx="8" fill="#ff4d5f" opacity=".8"/><rect x="260" y="222" width="42" height="168" rx="8" fill="#00c087" opacity=".8"/><rect x="344" y="170" width="42" height="220" rx="8" fill="#ff4d5f" opacity=".8"/><polyline points="76,330 160,292 244,310 330,206 428,146" fill="none" stroke="url(#ln)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle cx="428" cy="146" r="30" fill="#7dd3fc"/><circle cx="428" cy="146" r="14" fill="#e0f2fe"/><circle cx="456" cy="112" r="11" fill="#fbbf24"/></svg>`;
var url = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svgText);
document.getElementById('preview').src = url;
function dl(size, name){
  var img = new Image();
  img.onload = function(){
    var cv = document.createElement('canvas');
    cv.width = size; cv.height = size;
    cv.getContext('2d').drawImage(img, 0, 0, size, size);
    cv.toBlob(function(blob){
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = name;
      a.click();
      setTimeout(function(){ URL.revokeObjectURL(a.href); }, 3000);
    }, 'image/png');
  };
  img.src = url;
}
</script>
</body>
</html>
